[versions]
# Android / Kotlin core
agp                    = "9.3.2"
kotlin                 = "2.2.10"
ksp                    = "2.2.10-2.0.2"
coreKtx                = "1.16.0"
appcompat              = "1.7.1"

# Compose
composeBom             = "2026.02.01"
activityCompose        = "1.10.1"
lifecycleRuntimeKtx    = "2.9.1"
lifecycleViewmodelCompose = "2.9.1"

# Navigation
navigationCompose      = "2.9.0"
hiltExtensions         = "1.4.0"

# Hilt (Dagger)
hilt                   = "2.60.1"

# Room
room                   = "2.7.1"

# Firebase
firebaseBom            = "33.16.0"

# WorkManager
workmanager            = "2.10.2"

# DataStore
datastore              = "1.1.4"

# Coroutines
coroutines             = "1.10.2"

# Serialization
kotlinxSerialization   = "1.8.1"

# Charts
vico                   = "2.1.2"

# Image loading
coil                   = "3.2.0"

# Testing
junit                  = "4.13.2"
junitVersion           = "1.3.0"
espressoCore           = "3.7.0"
mockk                  = "1.14.2"
turbine                = "1.2.0"
coroutinesTest         = "1.10.2"

[libraries]
# AndroidX Core
androidx-core-ktx              = { group = "androidx.core",               name = "core-ktx",                    version.ref = "coreKtx" }
androidx-appcompat             = { group = "androidx.appcompat",           name = "appcompat",                   version.ref = "appcompat" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",   version.ref = "lifecycleViewmodelCompose" }

# Compose BOM + UI
androidx-compose-bom           = { group = "androidx.compose",             name = "compose-bom",                 version.ref = "composeBom" }
androidx-activity-compose      = { group = "androidx.activity",            name = "activity-compose",            version.ref = "activityCompose" }
androidx-compose-ui            = { group = "androidx.compose.ui",          name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",          name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",          name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
androidx-compose-material3     = { group = "androidx.compose.material3",   name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose    = { group = "androidx.navigation",          name = "navigation-compose",          version.ref = "navigationCompose" }
hilt-navigation-compose        = { group = "androidx.hilt",               name = "hilt-navigation-compose",     version.ref = "hiltExtensions" }

# Hilt (Dagger)
hilt-android                   = { group = "com.google.dagger",            name = "hilt-android",                version.ref = "hilt" }
hilt-android-compiler          = { group = "com.google.dagger",            name = "hilt-android-compiler",       version.ref = "hilt" }

# Room
room-runtime                   = { group = "androidx.room",                name = "room-runtime",                version.ref = "room" }
room-ktx                       = { group = "androidx.room",                name = "room-ktx",                    version.ref = "room" }
room-compiler                  = { group = "androidx.room",                name = "room-compiler",               version.ref = "room" }
room-testing                   = { group = "androidx.room",                name = "room-testing",                version.ref = "room" }

# Firebase (versions managed by BoM — do not add version.ref here)
firebase-bom                   = { group = "com.google.firebase",          name = "firebase-bom",                version.ref = "firebaseBom" }
firebase-auth                  = { group = "com.google.firebase",          name = "firebase-auth-ktx" }
firebase-firestore             = { group = "com.google.firebase",          name = "firebase-firestore-ktx" }
firebase-messaging             = { group = "com.google.firebase",          name = "firebase-messaging-ktx" }

# Google Sign-In
google-play-services-auth      = { group = "com.google.android.gms",       name = "play-services-auth",          version = "21.3.0" }

# WorkManager + Hilt integration
workmanager-runtime            = { group = "androidx.work",                name = "work-runtime-ktx",            version.ref = "workmanager" }
hilt-work                      = { group = "androidx.hilt",               name = "hilt-work",                   version.ref = "hiltExtensions" }
hilt-androidx-compiler         = { group = "androidx.hilt",               name = "hilt-compiler",               version.ref = "hiltExtensions" }

# DataStore
datastore-preferences          = { group = "androidx.datastore",           name = "datastore-preferences",       version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json",  version.ref = "kotlinxSerialization" }

# Charts (Vico)
vico-compose-m3                = { group = "com.patrykandpatrick.vico",    name = "compose-m3",                  version.ref = "vico" }

# Image loading (Coil)
coil-compose                   = { group = "io.coil-kt.coil3",             name = "coil-compose",                version.ref = "coil" }
coil-network-okhttp            = { group = "io.coil-kt.coil3",             name = "coil-network-okhttp",         version.ref = "coil" }

# Testing
junit                          = { group = "junit",                        name = "junit",                       version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",            name = "junit",                       version.ref = "junitVersion" }
androidx-espresso-core         = { group = "androidx.test.espresso",       name = "espresso-core",               version.ref = "espressoCore" }
mockk                          = { group = "io.mockk",                     name = "mockk",                       version.ref = "mockk" }
mockk-android                  = { group = "io.mockk",                     name = "mockk-android",               version.ref = "mockk" }
turbine                        = { group = "app.cash.turbine",             name = "turbine",                     version.ref = "turbine" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",     version.ref = "coroutinesTest" }

[plugins]
android-application            = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization           = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                            = { id = "com.google.devtools.ksp",                  version.ref = "ksp" }
hilt                           = { id = "com.google.dagger.hilt.android",           version.ref = "hilt" }
google-services                = { id = "com.google.gms.google-services",           version = "4.4.3" }
